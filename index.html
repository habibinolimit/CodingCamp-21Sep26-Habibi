<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>

  <!-- Chart.js from CDN (pinned version) -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"
    onerror="document.getElementById('chart-unavailable').style.display='block';document.getElementById('chart-section').style.display='none';"
  ></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Notification Banner (non-blocking, fixed top) -->
  <div
    id="notification-banner"
    role="alert"
    aria-live="assertive"
    style="display: none;"
  ></div>

  <!-- Chart unavailable message (shown only if CDN fails) -->
  <div id="chart-unavailable" style="display: none;" role="status">
    Chart unavailable - could not load the charting library.
  </div>

  <!-- ===== Page Wrapper ===== -->
  <div class="page-wrapper">

    <!-- ===== Balance Display ===== -->
    <header id="balance-section">
      <button id="theme-toggle" aria-label="Switch to dark mode" title="Toggle dark/light mode">&#x1F319;</button>
      <h1>TOTAL BALANCE</h1>
      <p class="balance-display">
        <span id="balance">$0.00</span>
      </p>
    </header>

    <!-- ===== Input Form + Transaction List (two-column grid) ===== -->
    <main id="main-section">

      <!-- Input Form -->
      <section id="form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>

        <form id="expense-form" novalidate>

          <div class="form-group">
            <label for="item-name">Item Name</label>
            <input
              type="text"
              id="item-name"
              name="item-name"
              maxlength="100"
              autocomplete="off"
              placeholder="e.g. Coffee"
            />
            <span class="error-msg" id="item-name-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="amount">Amount</label>
            <input
              type="number"
              id="amount"
              name="amount"
              step="1"
              min="1"
              placeholder="e.g. 15000"
            />
            <span class="error-msg" id="amount-error" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="">Select a category</option>
            </select>
            <span class="error-msg" id="category-error" aria-live="polite"></span>
          </div>

          <div class="form-group" id="custom-category-group">
            <label for="new-category-input">Add Custom Category</label>
            <div class="custom-category-row">
              <input type="text" id="new-category-input" maxlength="30" placeholder="e.g. Healthcare" autocomplete="off" />
              <button type="button" id="add-category-btn">Add</button>
            </div>
            <span class="error-msg" id="new-category-error" aria-live="polite"></span>
          </div>

          <button type="submit">Add Transaction</button>

        </form>
      </section>

      <!-- Transaction List -->
      <section id="transaction-section" aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <ul id="transaction-list" aria-label="Transaction list">
          <!-- Populated by js/app.js -->
        </ul>
      </section>

    </main>

    <!-- ===== Chart ===== -->
    <section id="chart-section" aria-labelledby="chart-heading">
      <h2 id="chart-heading">Spending by Category</h2>
      <div id="chart-placeholder" role="status">
        No spending data available.
      </div>
      <canvas id="chart" aria-label="Pie chart of spending by category" role="img"></canvas>
    </section>

    <!-- ===== Monthly Summary ===== -->
    <section id="monthly-section" aria-labelledby="monthly-heading">
      <h2 id="monthly-heading">Monthly Summary</h2>
      <div id="monthly-summary">
        <!-- Populated by js/app.js -->
      </div>
    </section>

  </div><!-- /.page-wrapper -->

  <script src="js/app.js" defer></script>
</body>
</html>
